$wall = $HOME/.config/hypr/wallpapers/david.jpg

# BACKGROUND
background {
    monitor =
    path = $wall
    blur_passes = 0
    contrast = 0.8916
    brightness = 0.8916
    vibrancy = 0.8916
    vibrancy_darkness = 0.0
}

# GENERAL
general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = false
}

# Profie-Photo
image {
    monitor =
    path = ~/.config/hypr/wallpapers/user.jpg
    border_size = 2
    border_color = rgba(137, 180, 250, 0.8)
    size = 150
    rounding = -1
    rotate = 0
    reload_time = -1
    reload_cmd = 
    position = 0, 170
    halign = center
    valign = center
}

# NAME
label {
    monitor =
    text = $USER
    color = rgba(216, 222, 233, 0.80)
    outline_thickness = 0
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    font_size = 32
    position = 0, 60
    halign = center
    valign = center
}

# Time
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +"%I:%M")</span>"
    color = rgba(216, 222, 233, 0.80)
    font_size = 60
    position = 0, -20
    halign = center
    valign = center
}

# Day-Month-Date
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%A, %B %d")"
    color = rgba(216, 222, 233, .80)
    font_size = 19
    font_family = SF Pro Display Bold
    position = 0, -90
    halign = center
    valign = center
}

# MAin-BOX
shape {
    monitor =
    size = 500, 500
    color = rgba(17, 17, 27, 0.85)
    rounding = 30
    border_size = 1
    border_color = rgba(120, 120, 160, 0.25)
    position = 0, -70
    halign = center
    valign = center
}

# USER-BOX
shape {
    monitor =
    size = 320, 55
    color = rgba(30, 30, 46, 0.70)
    rounding = -1
    border_size = 1
    border_color = rgba(137, 180, 250, 0.15)
    position = 0, -190
    halign = center
    valign = center
}

# USER
label {
    monitor =
    text =     $USER
    color = rgba(216, 222, 233, 0.80)
    outline_thickness = 0
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    font_size = 16
    position = 0, -190
    halign = center
    valign = center
}


shape {
    size = 320, 55
    color = rgba(24, 24, 37, 0.85)
    border_size = 1
    border_color = rgba(137, 180, 250, 0.20)
    rounding = -1
    position = 0, -268
    halign = center
    valign = center
}
# INPUT FIELD
input-field {
    monitor =
    size = 320, 55

    outline_thickness = 2

    outer_color = rgba(137, 180, 250, 0.35)
    inner_color = rgba(24, 24, 37, 0.95)

    font_color = rgb(205, 214, 244)

    check_color = rgba(166, 227, 161, 0.8)
    fail_color = rgba(243, 139, 168, 0.8)

    placeholder_text = <i><span foreground="##cdd6f4aa">  Password</span></i>

    hide_input = false

    position = 0, -268
    halign = center
    valign = center
}
